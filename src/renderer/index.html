<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' porter:; img-src 'self' porter: blob: data:; script-src 'self' porter:; style-src 'self' porter: 'unsafe-inline'; worker-src 'self' porter: blob:; connect-src porter:">
<title>Porter</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ===== Biblioteca ===== -->
  <div id="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>Porter</div>
      <nav class="tabs">
        <button class="tab active" data-view="library">Biblioteca</button>
        <button class="tab" data-view="history">Historial</button>
      </nav>
      <div class="search"><input id="search" type="search" placeholder="Buscar…" autocomplete="off"></div>
      <button class="btn" id="btn-add">+ Carpeta</button>
      <button class="icon-btn" id="btn-report" title="Reportar un fallo o sugerencia">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 8h-2.8a6 6 0 0 0-1.8-2l1.6-1.6L15.6 3l-2.2 2.2a6 6 0 0 0-2.8 0L8.4 3 7 4.4 8.6 6a6 6 0 0 0-1.8 2H4v2h2.1a6 6 0 0 0-.1 1v1H4v2h2v1c0 .3 0 .7.1 1H4v2h2.8a6 6 0 0 0 10.4 0H20v-2h-2.1c.1-.3.1-.7.1-1v-1h2v-2h-2v-1c0-.3 0-.7-.1-1H20zm-6 8h-4v-2h4zm0-4h-4v-2h4z"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Ajustes">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </header>
    <main id="content"></main>
  </div>

  <!-- ===== Lector ===== -->
  <div id="reader" hidden>
    <div id="stage" tabindex="0"></div>
    <div id="r-top" class="r-bar">
      <button class="icon-btn" id="r-back" title="Volver (Esc)">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
      </button>
      <div class="r-title"><div id="r-name"></div><div id="r-series"></div></div>
      <div class="seg" id="r-mode" title="Modo de lectura (M)">
        <button data-mode="manga">Manga</button>
        <button data-mode="ltr">Normal</button>
        <button data-mode="vertical">Vertical</button>
      </div>
      <button class="chip" id="r-double" title="Doble página (D)">Doble</button>
      <button class="chip" id="r-shift" title="Desplazar una página para cuadrar las dobles">Desplazar</button>
      <div class="seg" id="r-fit" title="Ajuste">
        <button data-fit="height">Alto</button>
        <button data-fit="width">Ancho</button>
        <button data-fit="original">100%</button>
      </div>
      <button class="icon-btn" id="r-rotate" title="Girar (R)">
        <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button class="icon-btn" id="r-report" title="Reportar un fallo">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 8h-2.8a6 6 0 0 0-1.8-2l1.6-1.6L15.6 3l-2.2 2.2a6 6 0 0 0-2.8 0L8.4 3 7 4.4 8.6 6a6 6 0 0 0-1.8 2H4v2h2.1a6 6 0 0 0-.1 1v1H4v2h2v1c0 .3 0 .7.1 1H4v2h2.8a6 6 0 0 0 10.4 0H20v-2h-2.1c.1-.3.1-.7.1-1v-1h2v-2h-2v-1c0-.3 0-.7-.1-1H20zm-6 8h-4v-2h4zm0-4h-4v-2h4z"/></svg>
      </button>
      <button class="icon-btn" id="r-full" title="Pantalla completa (F)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg>
      </button>
    </div>
    <div id="r-bottom" class="r-bar">
      <span id="r-count"></span>
      <input id="r-slider" type="range" min="0" max="0" value="0">
      <span id="r-zoom"></span>
      <button class="chip on" id="r-next" hidden>Siguiente tomo ›</button>
    </div>
    <div id="r-end" hidden></div>
    <div id="r-loading" hidden><div class="spinner"></div></div>
  </div>

  <div id="modal" hidden></div>
  <div id="ctx" hidden></div>
  <div id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
